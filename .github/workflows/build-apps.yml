# Compila automáticamente la app para Android, Windows e iOS y prueba el backend.
# Se ejecuta al hacer push a main o manualmente desde la pestaña "Actions" de GitHub.
# Los instaladores quedan para descargar en la sección "Artifacts" de cada ejecución.
name: Compilar apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (pruebas)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: parqueadero_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/parqueadero_test

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --org co.edu.umb --project-name parqueadero_app --platforms=android .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: parqueadero-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --org co.edu.umb --project-name parqueadero_app --platforms=windows .
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: parqueadero-windows
          path: app/build/windows/x64/runner/Release/

  ios:
    name: iOS (sin firmar)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash scripts/configurar_plataformas.sh
      - run: flutter build ios --release --no-codesign
      - name: Empaquetar .ipa sin firma
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr parqueadero-ios-sin-firmar.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: parqueadero-ios-sin-firmar
          path: app/parqueadero-ios-sin-firmar.ipa
